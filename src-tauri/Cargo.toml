[package]
name = "snapdrop"
version = "1.0.0"
description = "Windows screenshot capture & drag-to-drop utility"
authors = ["SnapDrop"]
edition = "2021"

[lib]
name = "snapdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rfd = "0.17"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
windows = { version = "0.62", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_Media_Audio",
] }
windows-core = "0.62"
windows-capture = "2.0"

# Vendored + patched fork of windows-capture 2.0.1 (see ../../vendor/windows-capture).
#
# Upstream only offers two ways to hand a frame to the encoder:
#   * `send_frame_buffer` — a CPU path that forces a GPU->CPU readback, a
#     per-frame staging-texture allocation, a blocking Map(), a row flip and
#     two more copies per frame;
#   * `send_frame` — a zero-copy GPU path, but it cannot crop, so a screen
#     region would record the monitor's top-left corner.
# The fork adds `send_frame_region()` (GPU-side crop with an arbitrary origin,
# using the frame's real WGC presentation timestamp) and bounds the frame
# queue so the encoder can never build an unbounded backlog.
[patch.crates-io]
windows-capture = { path = "../vendor/windows-capture" }
