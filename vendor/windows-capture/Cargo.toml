[package]
edition = "2024"
name = "windows-capture"
version = "2.0.1"
authors = ["NiiightmareXD"]
description = "Vendored + patched fork of windows-capture: adds GPU-side region crop and a bounded frame queue."
license = "MIT"
repository = "https://github.com/NiiightmareXD/windows-capture"
resolver = "3"

[lib]
name = "windows_capture"
path = "src/lib.rs"

# A/B harness comparing the GPU region crop against the original CPU
# crop+flip path. Not built as part of the app.
[[example]]
name = "region_bench"
path = "examples/region_bench.rs"

[dependencies.parking_lot]
version = "0.12.5"

[dependencies.rayon]
version = "1.12.0"

[dependencies.thiserror]
version = "2.0.18"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation_Metadata",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Security_Cryptography",
    "Storage_Streams",
    "Storage",
    "System",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "System_Threading",
]

[dependencies.windows-future]
version = "0.3.2"
